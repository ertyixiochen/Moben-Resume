<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="纯前端、本地优先的简历制作工具，使用 IndexedDB 保存简历数据。"
    />
    <title>墨本简历 - 本地优先简历制作工具</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar">
        <div class="brand" aria-label="墨本简历">
          <span class="brand-mark" aria-hidden="true">M</span>
          <div>
            <strong>墨本简历</strong>
          </div>
        </div>

        <div class="top-actions" aria-label="全局操作">
          <label class="control top-control"><span>字号</span><input id="topFontScale" type="range" min="0.92" max="1.08" step="0.01" aria-label="字号" /><output id="fontScaleValue"></output></label>
          <label class="control top-control"><span>行距</span><input id="lineScale" type="range" min="1.1" max="1.8" step="0.01" aria-label="行距" /><output id="lineScaleValue"></output></label>
          <div id="topToneOptions" class="top-tone-options" role="group" aria-label="栏目标题色调"></div>
          <button id="manageBtn" class="button" type="button" aria-expanded="false" aria-controls="editorPanel">内容</button>
          <!-- 模板切换功能暂时注释，保留脚本中的兼容逻辑以便读取旧偏好和旧 JSON。 -->
          <!-- <label class="control">
            <span>模板</span>
            <select id="templateSelect" aria-label="选择简历模板"></select>
          </label> -->
          <button id="smartFitBtn" class="button" type="button">智能一页</button>
          <button id="importBtn" class="button" type="button">导入</button>
          <input
            id="importFile"
            class="file-input-hidden"
            type="file"
            accept=".pdf,application/pdf"
            tabindex="-1"
            aria-hidden="true"
          />
          <div id="exportMenu" class="export-menu">
            <button id="exportBtn" class="button primary" type="button" aria-haspopup="true" aria-expanded="false" aria-controls="exportOptions">导出</button>
            <div id="exportOptions" class="export-options" role="menu" aria-label="选择导出格式">
              <button type="button" role="menuitem" data-export="pdf">PDF</button>
              <button type="button" role="menuitem" data-export="json">JSON</button>
              <button type="button" role="menuitem" data-export="md">Markdown</button>
            </div>
          </div>
        </div>
      </header>

      <main class="workspace">
        <aside id="editorPanel" class="editor-panel" aria-label="内容" hidden>
          <div class="drawer-heading"><strong>内容</strong><button id="closeManageBtn" class="icon-button" type="button" aria-label="关闭">×</button></div>
          <section class="editor-section drawer-layout">
            <label class="control"><span>密度</span><select id="densitySelect" aria-label="选择排版密度"></select></label>
            <label class="control checkbox-control"><input id="bulletToggle" type="checkbox" /><span>分点符</span></label>
          </section>
          <section class="privacy-panel" aria-label="隐私说明">
            <strong>隐私说明</strong>
            <p>
              简历内容只保存在本机浏览器的 IndexedDB，字号、密度、色调等偏好保存在
              localStorage。工具没有登录、后端、统计脚本、外部字体或 CDN；PDF 导入和文件导出也只在当前设备完成。
            </p>
          </section>

          <section id="personalSection" class="editor-section"></section>

          <section class="editor-section">
            <div class="section-heading">
              <div>
                <h2>模块顺序</h2>
                <p>拖拽模块左侧把手，或用上下按钮调整教育、经历、项目、技能等模块。</p>
              </div>
            </div>
            <div class="add-module-row">
              <select id="newSectionType" aria-label="选择要添加的模块"></select>
              <button id="addSectionBtn" class="button" type="button">添加模块</button>
            </div>
            <div id="sectionList" class="module-list" aria-label="模块列表"></div>
          </section>

          <section id="moduleEditor" class="editor-section"></section>
        </aside>

        <section class="preview-panel" aria-label="简历实时预览">
          <div class="preview-toolbar">
            <div>
              <strong>编辑简历</strong>
              <span id="saveStatus" role="status" aria-live="polite"></span>
            </div>
            <span id="pageCount">A4</span>
          </div>
          <div id="previewPages" class="paper-stack"></div>
          <div id="measureArea" aria-hidden="true"></div>
          <p class="privacy-note">简历只保存在本机浏览器中，不上传任何内容。</p>
        </section>
      </main>
    </div>

    <dialog id="importReview" class="import-review" aria-labelledby="importReviewTitle">
      <form method="dialog">
        <h2 id="importReviewTitle">确认导入 PDF</h2>
        <p id="importReviewSummary"></p>
        <label for="importReviewText">提取的文字</label>
        <textarea id="importReviewText" spellcheck="false"></textarea>
        <p class="import-review-note">可在这里修正文字。确认后将替换当前简历；扫描图片 PDF 需要先进行文字识别。</p>
        <div class="import-review-actions">
          <button id="cancelPdfImport" class="button" type="button">取消</button>
          <button id="confirmPdfImport" class="button primary" type="button">导入并替换</button>
        </div>
      </form>
    </dialog>

    <script src="./vendor/build/pdf.min.js" defer></script>
    <script src="./vendor/build/pdf.worker.min.js" defer></script>
    <script src="./pdf-io.js" defer></script>
    <script src="./app.js" defer></script>
  </body>
</html>
